name: 💡 Feature Request
description: Propose a new feature, integration, or design idea for Sia
title: "[Feature]: "
labels: ["enhancement", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a new idea for Sia! We appreciate your feedback.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe it.
      placeholder: I find it cumbersome to manually copy my Canvas assignments into tasks every Monday...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Feature
      description: Describe the solution you'd like to see.
      placeholder: Introduce an automated Canvas LMS OAuth integration that syncs weekly homework directly into the schedule blocks.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
      placeholder: Using iCal calendar feeds or manual CSV import.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context & Mockups
      description: Add any other context, wireframes, screenshots, or API references.
    validations:
      required: false
